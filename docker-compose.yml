services:
  app1:
    build: .
    environment:
      - DATABASE_URL=postgres://capstone:${DB_PASSWORD:?isi DB_PASSWORD di .env}@db:5432/capstone
      - PORT=3000
      - INSTANCE=app1
    depends_on:
      - db
    restart: unless-stopped

  app2:
    build: .
    environment:
      - DATABASE_URL=postgres://capstone:${DB_PASSWORD:?isi DB_PASSWORD di .env}@db:5432/capstone
      - PORT=3000
      - INSTANCE=app2
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      POSTGRES_DB: capstone
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?isi GRAFANA_PASSWORD di .env}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
