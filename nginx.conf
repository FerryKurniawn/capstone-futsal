log_format lb '$remote_addr [$time_local] "$request" $status '
              'upstream=$upstream_addr served=$upstream_http_x_served_by '
              'rt=$request_time urt=$upstream_response_time';
access_log /var/log/nginx/access.log lb;

upstream app_backend {
    # Round Robin = tanpa direktif. Ganti algoritma dengan: sh ./switch-lb.sh rr|lc|iphash
    server app1:3000;
    server app2:3000;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/capstone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capstone/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://app_backend/health;
    }
}
